<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor (Single Form)</title>
    <style>
        textarea {
            background-color: #000000;
            color: #ffffff;
            width: 500px;
            height: 200px;
            font-family: monospace;
            resize: vertical;
        }

        input[type="url"] {
            width: 500px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<form id="editorForm">
    <label>
        <input
                type="text"
                name="uri"
                placeholder="Enter resource URI"
                required
        />
    </label>

    <button type="submit" name="action" value="fetch">Fetch</button>
    <button type="submit" name="action" value="commit">Commit</button>

    <br><br>

    <label>
        <textarea name="content" spellcheck="false"></textarea>
    </label>
</form>

<script src="editor.js"></script>
</body>
</html>

<form action="/Spec/Login" method="post">
    <label>
        <input
                type="text"
                name="username"
                placeholder="User Name"
                id="username"
        >
    </label>
    <label>
        <input
                type="password"
                name="password"
                placeholder="Password"
                id="password"
        >
    </label>
    <button
            type="submit"
            name="action"
            value="login"
    >Login</button>
</form>
